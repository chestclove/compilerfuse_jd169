[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "chestclove-compilerfuse_jd169"
version = "0.1.0"
description = "按段落统计编译器与算子融合专家·张量并行切分策略相关的长度分布，标出过长、过短与重复表达的部分"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "chestclove" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://chestclove.github.io"
Repository = "https://github.com/chestclove/compilerfuse_jd169"
Issues = "https://github.com/chestclove/compilerfuse_jd169/issues"

[project.scripts]
compilerfuse_jd169 = "compilerfuse_jd169:main"

[tool.setuptools]
py-modules = ["compilerfuse_jd169"]
